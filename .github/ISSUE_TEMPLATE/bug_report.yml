name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the command or code you ran and the full error.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "1.0.0"
  - type: input
    id: env
    attributes:
      label: Python version and OS
      placeholder: "Python 3.11, Ubuntu 24.04"
  - type: markdown
    attributes:
      value: "Do not attach real voice recordings or profile files of real people."
