name: Feature request
description: Suggest a new metric, integration or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: evidence
    attributes:
      label: References
      description: Papers, standards or tools that support a new speech measure.
